[project]
name = "pathfinder"
version = "0.1.0"
description = "中国 AI 求职情报 + 人脉路径 + 内推 + CRM：一个 Forward-Deployed 风格的求职 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# 真实模型调用时才需要；不装也能用 mock provider 跑通整条管道
llm = ["anthropic>=1.0", "openai>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
pf = "pathfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
