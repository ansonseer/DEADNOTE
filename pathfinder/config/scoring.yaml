# Fit Score（0-100）的打分规则。所有分数由代码计算，模型只负责提供"特征 + 证据"。
# 改这里就能改优先级逻辑，不用改代码。
weights:
  role_match: 30          # 岗位语义与 FDE / Solution Engineering 原型的贴合度
  team_direction: 20      # 团队方向（Agent / 企业 AI / 行业交付 vs 纯模型研发）
  experience_overlap: 20  # 你的经历与 JD 的重叠度
  feasibility: 15         # 0-3 年 / 校招 / headcount / 城市 等进入可行性
  path: 15                # 人脉路径强度（找到了谁、能走多强的内推）

bonuses:
  au_bridge: 3            # 公司同时有中国 + 澳洲足迹（2027 回澳的桥梁）
  fresh_signal: 2         # 30 天内有招聘 / 扩张 / 产品发布信号
  proof_asset: 2          # 已有针对该团队的作品（PoC / 拆解文 / 贡献）

# 团队方向 → 得分系数
direction_scores:
  agent: 1.0
  enterprise_ai: 1.0
  industry_delivery: 0.9
  platform: 0.8
  consumer: 0.4
  model_research: 0.2
  unknown: 0.5

# 人脉路径阶梯（path_level）→ 得分系数
# 0 没人  1 冷联系(有渠道)  2 普通内推(任意员工)  3 Warm Referral(团队内、聊过)
# 4 Hiring Manager 推荐  5 Sponsor(HM 主动推你)
path_scores: [0.0, 0.3, 0.5, 0.7, 0.85, 1.0]

# 公司筛选（哪 20 家进 pilot）：按"对你的适配度"排，不按公司体量。
# tier 1 云/大模型平台（解决方案岗最多）、3 企业 AI/Agent 服务商（最像 FDE、门槛友好）、
# 4 外企/咨询（中澳双足迹）、2 大模型公司（ToB 岗少）。seeds.yaml 里可用 screen_boost 单独加减分。
screen:
  tier_weight: {1: 3.0, 2: 2.4, 3: 2.8, 4: 2.5}
  au_bonus: 0.5
  team_hypothesis_bonus: 0.1    # 每个团队假设 +0.1，最多计 3 个

# 优先级分层
tiers:
  A1: 85
  A2: 75
  B: 60
  # 其余为 C

# CRM 跟进节奏（小时）
cadence:
  followup_1_hours: 60      # 首条私信后 48–72h 无回复 → follow-up 1
  followup_2_hours: 168     # 再 7 天无回复 → follow-up 2（换角度、给价值）
  reply_next_action_hours: 24
  conversation_value_touch_hours: 168
  referral_check_hours: 120
  max_followups: 2          # 超过则 park，并切换到同团队另一位联系人

# 人脉账户：给予 / 索取 比例低于阈值时，日报会提醒"先给价值"
relationship_account:
  min_value_to_ask_ratio: 1.0
