# 强负向信号：命中多个 → 基本可以排除（不是我们要的岗位）
negative_signals:
  pure_research: ["预训练", "强化学习算法", "模型训练", "CUDA", "算子", "推理优化", "SFT 训练", "论文"]
  pure_sales: ["KA 销售", "销售指标", "业绩提成", "陌拜"]
  pure_product: ["PRD", "产品经理", "原型设计"]
  irrelevant: ["数据标注", "硬件", "嵌入式", "测试工程师"]

# 团队方向识别（研究阶段用来判断"他们到底在做什么"）
