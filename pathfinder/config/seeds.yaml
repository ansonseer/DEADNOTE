# 种子公司池（Pilot 从这里筛 20 家）。
# 重要：这里的 BU / 团队名是"待验证的假设"，不是事实。research 阶段必须用公开来源确认后才计分。
# au_footprint: 该公司在澳洲是否有实体团队（2027 回澳的桥梁；配置 long_term.au_bridge_bonus 时加分）。
# screen_boost: 人工加减分（见 scoring.yaml 的 screen 段），用来表达『我就是想优先看这家』。
# tier: 1 大厂云/大模型平台  2 大模型公司商业化  3 企业 AI/Agent 服务商  4 外企在华/咨询（双足迹）
pilot_size: 20

companies:
