      - "飞书 AI 企业解决方案"
    why: "企业 Agent 平台化最激进的一家，解决方案岗成长快。"
    careers_url: "https://jobs.bytedance.com"
  - name: "腾讯云"
    aliases: ["Tencent Cloud", "腾讯云智能"]
    tier: 1
    hq: "深圳"
    au_footprint: false
