  - name: "阿里云"
    aliases: ["Alibaba Cloud", "阿里云智能"]
    tier: 1
    hq: "杭州"
    au_footprint: true
    team_hypotheses:
      - "百炼 / 通义大模型 解决方案架构团队"
      - "阿里云智能 行业解决方案（金融/零售/制造）"
      - "阿里云 国际业务（ANZ 区域）解决方案"
    why: "大模型平台 + 行业交付都有；澳洲有 Region 与本地团队，是最典型的中澳桥梁。"
